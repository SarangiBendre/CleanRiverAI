<!DOCTYPE html>
<html>
<head>
    <title>Clean River AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-left h2 {
            margin: 0;
        }

        .nav-right a button {
            margin-left: 10px;
        }

        /* BUTTON */
        .nav-btn {
            background: #ffffff;
            color: #0f2027;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: #00bcd4;
            color: white;
        }

        /* FORM */
        .form-card {
            max-width: 600px;
            margin: auto;
        }

        .form-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }

        .form-card button {
            width: 100%;
            margin-top: 10px;
        }

        /* 🔥 LOADER */
        .loader {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 32, 39, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ccc;
            border-top: 6px solid #00bcd4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- NAVBAR -->
    <div class="navbar">

        <div class="nav-left">
            <h2>🌊 Clean River AI</h2>
        </div>

        <div class="nav-right">

            <a href="/history">
                <button class="nav-btn">📜 History</button>
            </a>

            <a href="/logout">
                <button class="nav-btn">🚪 Logout</button>
            </a>

        </div>

    </div>

    <!-- TITLE -->
    <h1>River Pollution Detection</h1>

    <!-- FORM -->
    <div class="card form-card">

        <!-- 🔥 FORM UPDATED -->
        <form action="/predict" method="POST" enctype="multipart/form-data" onsubmit="showLoader()">

            <input type="text" name="river" placeholder="Enter River Name" required>

            <input type="text" id="location" name="location" placeholder="Enter Location" required>

            <button type="button" onclick="getLocation()">📍 Use My Location</button>

            <input type="file" name="image" required>

            <button type="submit">🚀 Analyze Pollution</button>

        </form>

    </div>

</div>

<!-- 🔥 LOADER UI -->
<div id="loader" class="loader">
    <div class="spinner"></div>
    <p>Analyzing River Pollution...</p>
</div>

<script>
function getLocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            document.getElementById("location").value =
                position.coords.latitude + ", " + position.coords.longitude;
        });
    } else {
        alert("Geolocation not supported");
    }
}

/* 🔥 SHOW LOADER */
function showLoader() {
    document.getElementById("loader").style.display = "flex";
}
</script>

</body>
</html>
